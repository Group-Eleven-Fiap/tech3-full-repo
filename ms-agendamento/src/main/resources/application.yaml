spring:
  application:
    name: ms-agendamento

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agendamento}
    username: ${DB_USERNAME:agendamento}
    password: ${DB_PASSWORD:agendamento}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  graphql:
    http:
      path: /api/v1/graphql

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:agendamento}
    password: ${RABBITMQ_PASSWORD:agendamento}

app:
  security:
    jwt:
      secret: ${APP_JWT_SECRET:change-this-demo-secret-to-a-long-random-value-32}
      expiration-seconds: ${APP_JWT_EXPIRATION_SECONDS:3600}
  messaging:
    exchange: ${AGENDAMENTO_EVENTS_EXCHANGE:agendamento.events}
    routing-key: ${AGENDAMENTO_EVENTS_ROUTING_KEY:agendamento.appointment.changed}
  outbox:
    publisher-enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
    publisher-delay-ms: ${OUTBOX_PUBLISHER_DELAY_MS:5000}
    retry-delay-seconds: ${OUTBOX_RETRY_DELAY_SECONDS:30}
